<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App harness</title>
<link rel="stylesheet" href="../../app.css">
</head>
<body>
<!--
  Runs the real app.html / app.js outside the extension, with stubbed
  chrome.* APIs and a mock NVR behind fetch(). For click-through testing of
  the UI wiring. Inspect window.mockDevice for requests and saved XML;
  set window.mockDevice.rejectAuth = true to simulate a password change.
-->
<script>
(() => {
  const realFetch = window.fetch.bind(window);
  const fixtures = {};
  const store = { local: {}, session: {} };
  const area = (name) => ({
    get: (keys, cb) => {
      const out = {};
      for (const k of [].concat(keys)) if (k in store[name]) out[k] = store[name][k];
      return cb ? cb(out) : Promise.resolve(out);
    },
    set: (obj) => { Object.assign(store[name], obj); return Promise.resolve(); },
    remove: (k) => { delete store[name][k]; return Promise.resolve(); },
  });
  window.chrome = {
    storage: { local: area('local'), session: area('session') },
    permissions: { request: async () => true, remove: async () => true },
    runtime: { id: 'harness', getURL: (p) => p },
  };

  // A tiny JPEG-ish frame per request so object URLs change each time
  const frame = () => new Promise(res => {
    const c = Object.assign(document.createElement('canvas'), { width: 320, height: 180 });
    const g = c.getContext('2d');
    g.fillStyle = `hsl(${(Date.now() / 20) % 360} 60% 40%)`; g.fillRect(0, 0, 320, 180);
    g.fillStyle = '#fff'; g.font = '20px sans-serif'; g.fillText(new Date().toLocaleTimeString(), 20, 100);
    c.toBlob(res, 'image/jpeg');
  });

  const device = window.mockDevice = {
    requests: [], puts: [], inFlightSnapshots: 0, maxInFlightSnapshots: 0, rejectAuth: false,
  };
  const xml = (body) => new Response(body, { status: 200, headers: { 'Content-Type': 'application/xml' } });

  window.fetch = async (url, opts = {}) => {
    const u = new URL(url, location.href);
    if (u.hostname !== '192.168.0.108') return realFetch(url, opts);
    const method = opts.method || 'GET';
    device.requests.push(`${method} ${u.pathname}`);
    if (device.rejectAuth) {
      return new Response('', { status: 401, headers: { 'WWW-Authenticate': 'Digest realm="r", nonce="n", qop="auth"' } });
    }
    const p = u.pathname;
    if (method === 'PUT') { device.puts.push({ path: p, body: opts.body }); return xml('<ResponseStatus><statusCode>1</statusCode></ResponseStatus>'); }
    if (p === '/ISAPI/System/deviceInfo') return xml('<DeviceInfo><deviceName>Mock NVR</deviceName><model>DS-7604</model><firmwareVersion>V4.0</firmwareVersion></DeviceInfo>');
    // Like a real NVR with only IP cameras: no analog inputs, channels via InputProxy
    if (p === '/ISAPI/System/Video/inputs/channels') return new Response('', { status: 403 });
    if (p === '/ISAPI/ContentMgmt/InputProxy/channels') return xml('<InputProxyChannelList><InputProxyChannel><id>1</id><name>Front &amp; Gate</name></InputProxyChannel><InputProxyChannel><id>2</id><name>&lt;img src=x onerror=alert(1)&gt;</name></InputProxyChannel></InputProxyChannelList>');
    if (/^\/ISAPI\/Streaming\/channels\/\d+01\/picture$/.test(p)) {
      device.inFlightSnapshots++;
      device.maxInFlightSnapshots = Math.max(device.maxInFlightSnapshots, device.inFlightSnapshots);
      await new Promise(r => setTimeout(r, 1500)); // slower than the 1s cadence
      device.inFlightSnapshots--;
      return new Response(await frame(), { status: 200 });
    }
    if (p.endsWith('/motionDetection/capabilities')) return xml(fixtures.motionCaps);
    if (p.endsWith('/motionDetection')) return xml(fixtures.motion);
    if (p.endsWith('/privacyMask')) return xml(fixtures.privacy);
    if (/\/Event\/triggers\/VMD-\d+$/.test(p)) return xml(fixtures.trigger);
    return new Response('', { status: 404 });
  };

  // Load fixtures and the app's own markup + scripts, in order
  (async () => {
    [fixtures.motion, fixtures.privacy, fixtures.trigger, fixtures.motionCaps] = await Promise.all(
      ['motionDetection', 'privacyMask', 'eventTrigger', 'motionCapabilities-nvr'].map(n => realFetch(`../fixtures/${n}.xml`).then(r => r.text())));
    const page = new DOMParser().parseFromString(await realFetch('../../app.html').then(r => r.text()), 'text/html');
    const scripts = [...page.querySelectorAll('script[src]')].map(s => s.getAttribute('src'));
    page.querySelectorAll('script').forEach(s => s.remove());
    document.body.insertAdjacentHTML('beforeend', page.body.innerHTML);
    for (const src of scripts) {
      await new Promise((res, rej) => {
        const s = Object.assign(document.createElement('script'), { src: `../../${src}`, onload: res, onerror: rej });
        document.body.appendChild(s);
      });
    }
    window.harnessReady = true;
  })();
})();
</script>
</body>
</html>
