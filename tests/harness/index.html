<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App harness</title>
<link rel="stylesheet" href="../../extension/app.css">
</head>
<body>
<!--
  Manual harness: the real config page (extension/app.html + src/main.js)
  outside the extension, with stubbed chrome.* APIs and a mock NVR, for
  clicking through UI changes without a device. Run `npm run harness`.

  In the console, `mockDevice` exposes requests and saved XML; set
  `mockDevice.rejectAuth = true` to simulate a password change on the device
  (add `mockDevice.loginLock = {lockStatus: 'lock', unlockTime: 1800, retryLoginTime: 0}`
  to see the lock message at Connect),
  `mockDevice.unreachable = true` for a wrong IP address,
  `mockDevice.offlineChannels = ['4']` before Connect to see a disconnected camera
  (its feed shows "No signal"; set it while viewing a channel to see a camera
  stop answering, and back to [] to see it recover),
  `mockDevice.writeStatus = {statusCode: 7, statusString: 'Reboot Required', subStatusCode: 'rebootRequired'}`
  for a save that needs a reboot, or add an error answer to
  `mockDevice.failures` (see tests/support/mock-nvr.js).
  Live snapshots are a cached still that changes once a second, like the
  DS-7604NI's (the fps readout shows about 1); set
  `mockDevice.snapshotRefreshMs = 0` for a camera that sends a new picture
  for every request (about 3–5 fps), and switch to another tab and back to
  see the feeds stop and resume in `mockDevice.requests`.
  Use host 192.168.0.108 and any password to connect.
-->
<script type="module">
  import appHtml from '../../extension/app.html?raw';
  import { createChromeStub, createMockNvr } from '../support/mock-nvr.js';

  const page = new DOMParser().parseFromString(appHtml, 'text/html');
  page.querySelectorAll('script').forEach(s => s.remove());
  document.body.insertAdjacentHTML('beforeend', page.body.innerHTML);

  window.chrome = createChromeStub().chrome;
  const device = createMockNvr({ snapshotDelayMs: 300, realFetch: window.fetch.bind(window) });
  device.snapshotRefreshMs = 1000;
  window.fetch = device.fetch;
  window.mockDevice = device;

  await import('../../extension/src/main.js');
</script>
</body>
</html>
